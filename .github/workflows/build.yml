name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ZanarkandWorkshop.sln

      - name: Build
        run: dotnet build .\ZanarkandWorkshop.sln -c Release --no-restore

      - name: Command flag round-trip check
        run: dotnet run --project .\tests\CommandFlagsSmoke\CommandFlagsSmoke.csproj -c Release --no-build --no-restore

      - name: Battle formation round-trip check
        run: dotnet run --project .\tests\BattleFormationSmoke\BattleFormationSmoke.csproj -c Release --no-build --no-restore

      - name: Sphere Grid round-trip check
        run: dotnet run --project .\tests\SphereGridSmoke\SphereGridSmoke.csproj -c Release --no-build --no-restore

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\scripts\build-release.ps1 -Version $version

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem -LiteralPath .\artifacts -Filter '*.zip' | Select-Object -First 1
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $notes = ".\RELEASE_NOTES_v$version.md"
          $arguments = @(
            "release", "create", "${{ github.ref_name }}",
            $archive.FullName,
            "--draft",
            "--title", "Zanarkand Workshop ${{ github.ref_name }}"
          )
          if (Test-Path -LiteralPath $notes) {
            $arguments += @("--notes-file", $notes)
          } else {
            $arguments += "--generate-notes"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
